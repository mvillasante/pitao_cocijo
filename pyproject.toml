[build-system]
requires = ["flit_core >=2,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.metadata]
author = "MVB"
author-email = "mario.villasante@ciencias.unam.mx"
classifiers = [ "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",]
description-file = "README.md"
home-page = "https://github.com/IslasGECI/module"
module = "cocijo"
requires = [
	"babel",
	"pandas",
	"matplotlib",
	"streamlit",
	"typer"
]
requires-python=">=3.9"
[tool.flit.scripts]
cocijo = "cocijo.cli:app"
