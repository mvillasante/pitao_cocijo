name: Push latest
on:
  push:
    branches:
      - develop
jobs:
  ci-cd:
    name: 🔁✅ Continuous integration pipeline
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@main
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: 🐋🏗️ Build container 
      uses: docker/build-push-action@v5
      with:
        context: .
        tags: mvillasante/cocijo:latest
        outputs: type=docker
    - name: 🎨💄 Verifica el formato
      run: docker run mvillasante/cocijo:latest make check
    - name: 🐍☔ Test Python module
      run: docker run --volume $PWD:/workdir mvillasante/cocijo:latest make coverage
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: mvillasante/pitao_cocijo
    - name: 💫📈 Update graphics
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add lluvia_diaria.png
        git commit -m "generated"
        git push
    - name: 🏷️ Create/Update tag
      uses: rickstaa/action-create-tag@v1.5.4
      with:
        tag: "latest"
        message: "Latest release"
        force_push_tag: true
