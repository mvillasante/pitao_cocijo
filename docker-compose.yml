services:
  develop:
    build:
      context: .
      dockerfile: Dockerfile
    image: mvillasante/cocijo:latest
    command: bash
    volumes:
      - $PWD:/workdir

  streamlit:
    image: mvillasante/cocijo:latest
    entrypoint: ["streamlit", "run", "cocijo/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    volumes:
      - $PWD:/workdir
